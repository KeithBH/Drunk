<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drunk Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <div>
          <h1>饮酒数据看板</h1>
          <p>快速了解你的饮酒结构与近期趋势</p>
        </div>
      </header>

      <section class="filters card" aria-label="时间筛选">
        <div class="filter-buttons" role="tablist" aria-label="快捷时间范围">
          <button class="chip active" data-range="7" role="tab" aria-selected="true">7天</button>
          <button class="chip" data-range="30" role="tab" aria-selected="false">30天</button>
          <button class="chip" data-range="90" role="tab" aria-selected="false">90天</button>
          <button class="chip" data-range="custom" role="tab" aria-selected="false">自定义</button>
        </div>
        <form class="custom-range" id="customRange" hidden>
          <label>
            开始日期
            <input type="date" id="dateFrom" />
          </label>
          <label>
            结束日期
            <input type="date" id="dateTo" />
          </label>
          <button type="submit" class="chip apply">应用</button>
        </form>
      </section>

      <section id="emptyState" class="empty-state card" hidden>
        <h2>还没有饮酒记录</h2>
        <p>上传第一条记录后，这里会展示你的总量、纯酒精摄入和趋势分析。</p>
        <a href="#" class="cta">去上传第一条记录</a>
      </section>

      <section id="dashboardContent" class="dashboard-grid" aria-live="polite">
        <article class="card metric">
          <h2>总饮酒量</h2>
          <p id="totalVolume" class="value">--</p>
          <small>单位：ml</small>
        </article>

        <article class="card metric">
          <h2>纯酒精摄入</h2>
          <p id="pureAlcohol" class="value">--</p>
          <small>单位：g</small>
        </article>

        <article class="card chart trend-card">
          <h2>近30天趋势</h2>
          <svg id="trendChart" viewBox="0 0 320 160" role="img" aria-label="近30天饮酒趋势图"></svg>
        </article>

        <article class="card chart">
          <h2>分类占比</h2>
          <div class="category-wrap">
            <div id="categoryPie" class="pie" aria-label="分类占比图"></div>
            <ul id="categoryLegend" class="legend"></ul>
          </div>
        </article>

        <article class="card top-list">
          <h2>偏好 Top 榜单</h2>
          <ol id="topRank"></ol>
        </article>
      </section>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
